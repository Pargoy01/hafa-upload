<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Generator - HAFA TOOLS</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Inter,Arial,sans-serif;
    background:linear-gradient(135deg,#f8fbff,#eef4ff);
    color:#0f172a;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

.back{
    display:inline-block;
    margin-bottom:25px;
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}

.hero{
    background:linear-gradient(135deg,#2563eb,#4f46e5,#7c3aed);
    color:white;
    border-radius:28px;
    padding:40px;
    box-shadow:0 20px 50px rgba(37,99,235,.22);
    margin-bottom:25px;
}

.hero h1{
    margin:0 0 10px;
    font-size:34px;
}

.hero p{
    margin:0;
    color:#dbeafe;
}

.card{
    background:rgba(255,255,255,.95);
    border:1px solid #e2e8f0;
    border-radius:24px;
    padding:28px;
    box-shadow:0 12px 35px rgba(15,23,42,.07);
    margin-bottom:22px;
}

label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
}

textarea,select,input{
    width:100%;
    border:1px solid #dbe3ef;
    border-radius:14px;
    padding:14px;
    font-size:15px;
    outline:none;
    background:white;
}

textarea{
    min-height:150px;
    resize:vertical;
}

textarea:focus,select:focus,input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    margin-top:20px;
}

button{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(37,99,235,.2);
}

button:hover{
    transform:translateY(-2px);
}

#result{
    display:none;
    white-space:pre-wrap;
    line-height:1.7;
    background:#f8fafc;
    padding:20px;
    border-radius:16px;
}

@media(max-width:700px){
    .grid{grid-template-columns:1fr}
    .hero{padding:28px}
    .hero h1{font-size:27px}
}
</style>
</head>

<body>

<div class="container">

<a href="dashboard.html" class="back">← Kembali ke Dashboard</a>

<div class="hero">
    <h1>🎬 AI Video Generator</h1>
    <p>Buat konsep video AI sinematik dari ide kamu.</p>
</div>

<div class="card">

<label for="idea">💡 Ide Video</label>

<textarea id="idea" placeholder="Contoh: seorang pria berjalan sendirian di tengah hujan dan menemukan seseorang dari masa lalunya..."></textarea>

<div class="grid">

<div>
<label for="duration">⏱️ Durasi</label>
<select id="duration">
<option>5 detik</option>
<option selected>10 detik</option>
<option>15 detik</option>
<option>30 detik</option>
</select>
</div>

<div>
<label for="ratio">📐 Rasio</label>
<select id="ratio">
<option selected>9:16 Portrait</option>
<option>16:9 Landscape</option>
<option>1:1 Square</option>
</select>
</div>

<div>
<label for="style">🎨 Gaya</label>
<select id="style">
<option selected>Cinematic Realistic</option>
<option>Ultra Realistic</option>
<option>Film Drama</option>
<option>Romantic</option>
<option>Action</option>
<option>Horror</option>
<option>Anime</option>
</select>
</div>

<div>
<label for="camera">🎥 Kamera</label>
<select id="camera">
<option selected>Cinematic Camera</option>
<option>Close Up</option>
<option>Wide Shot</option>
<option>Handheld</option>
<option>Drone Shot</option>
<option>Slow Motion</option>
</select>
</div>

</div>

<button onclick="generatePrompt()">✨ Generate AI Video Prompt</button>

</div>

<div class="card" id="resultCard" style="display:none">

<h2>🎞️ Hasil Prompt</h2>

<div id="result"></div>

</div>

</div>

<script>
function generatePrompt(){

    const idea=document.getElementById("idea").value.trim();
    const duration=document.getElementById("duration").value;
    const ratio=document.getElementById("ratio").value;
    const style=document.getElementById("style").value;
    const camera=document.getElementById("camera").value;

    if(!idea){
        alert("Masukkan ide video terlebih dahulu.");
        return;
    }

    const prompt =
`Buat video AI ${duration} dengan rasio ${ratio}.

IDE CERITA:
${idea}

GAYA VISUAL:
${style}, sangat realistis, cinematic seperti adegan film profesional, detail wajah natural, pencahayaan realistis, tekstur lingkungan sangat detail.

KAMERA:
${camera}, pergerakan kamera halus dan sinematik.

DETAIL:
Gerakan karakter natural, ekspresi emosional, lingkungan hidup dan realistis, depth of field, cinematic lighting, realistic shadows, high detail, smooth motion, professional filmmaking.

JAGA KONSISTENSI:
Karakter, pakaian, wajah, lokasi dan suasana harus konsisten sepanjang adegan.

HASIL:
Video terlihat seperti rekaman film nyata, bukan seperti video AI.`;

    document.getElementById("result").textContent=prompt;
    document.getElementById("resultCard").style.display="block";
    document.getElementById("result").style.display="block";
}
</script>

</body>
</html>
