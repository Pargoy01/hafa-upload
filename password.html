<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator — HAFA TOOLS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f9fc;
    color:#0f172a;
}

/* TOPBAR */

.topbar{
    height:72px;
    background:white;
    border-bottom:1px solid #e5eaf2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
}

.logo{
    text-decoration:none;
    font-size:22px;
    font-weight:800;
    color:#111827;
}

.logo span{
    color:#2563eb;
}

.back{
    text-decoration:none;
    color:#64748b;
    font-size:14px;
    font-weight:700;
}

.back:hover{
    color:#2563eb;
}

/* MAIN */

.main{
    min-height:calc(100vh - 72px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 20px;
}

.card{
    width:100%;
    max-width:620px;
    background:white;
    border:1px solid #e5eaf2;
    border-radius:20px;
    padding:38px;
    box-shadow:0 25px 60px rgba(15,23,42,.07);
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:30px;
}

.icon{
    width:60px;
    height:60px;
    margin:0 auto 16px;
    border-radius:16px;
    background:#eff6ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.header h1{
    font-size:30px;
    margin-bottom:8px;
    letter-spacing:-1px;
}

.header p{
    color:#64748b;
    font-size:14px;
}

/* RESULT */

.result-box{
    display:flex;
    gap:10px;
    margin-bottom:28px;
}

.result{
    flex:1;
    min-width:0;
    padding:16px;
    border:1px solid #dbe3ef;
    border-radius:11px;
    background:#f8fafc;
    font-family:monospace;
    font-size:16px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.copy-btn{
    border:none;
    padding:0 20px;
    border-radius:11px;
    background:#0f172a;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.copy-btn:hover{
    background:#1e293b;
}

/* OPTIONS */

.option{
    margin-bottom:23px;
}

.option-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.option-header label{
    font-size:14px;
    font-weight:700;
}

.length-value{
    color:#2563eb;
    font-weight:800;
}

input[type="range"]{
    width:100%;
    accent-color:#2563eb;
    cursor:pointer;
}

.checks{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.check{
    display:flex;
    align-items:center;
    gap:9px;
    padding:12px;
    border:1px solid #e5eaf2;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
    color:#475569;
}

.check:hover{
    border-color:#bfdbfe;
}

.check input{
    accent-color:#2563eb;
}

/* GENERATE */

.generate-btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:11px;
    background:#2563eb;
    color:white;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    margin-top:5px;
    box-shadow:0 10px 25px rgba(37,99,235,.2);
}

.generate-btn:hover{
    background:#1d4ed8;
}

/* STRENGTH */

.strength{
    margin-top:25px;
}

.strength-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:7px;
}

.strength-text{
    font-weight:800;
}

.strength-bar{
    width:100%;
    height:7px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
}

.strength-fill{
    width:0%;
    height:100%;
    background:#2563eb;
    transition:.25s;
}

/* FOOTER */

.tip{
    margin-top:25px;
    padding:14px;
    background:#f8fafc;
    border-radius:10px;
    color:#64748b;
    font-size:12px;
    line-height:1.6;
}

@media(max-width:500px){

    .topbar{
        padding:0 20px;
    }

    .card{
        padding:25px 20px;
    }

    .header h1{
        font-size:26px;
    }

    .checks{
        grid-template-columns:1fr;
    }

    .result-box{
        flex-direction:column;
    }

    .copy-btn{
        padding:13px;
    }

}

</style>
</head>

<body>


<header class="topbar">

<a href="dashboard.html" class="logo">
HAFA<span>TOOLS</span>
</a>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</header>


<main class="main">

<div class="card">


<div class="header">

<div class="icon">
🔐
</div>

<h1>Password Generator</h1>

<p>
Create strong random passwords instantly.
</p>

</div>


<!-- RESULT -->

<div class="result-box">

<div
class="result"
id="passwordResult"
>
Generating...
</div>

<button
class="copy-btn"
onclick="copyPassword()"
>
Copy
</button>

</div>


<!-- LENGTH -->

<div class="option">

<div class="option-header">

<label>
Password Length
</label>

<span
class="length-value"
id="lengthValue"
>
16
</span>

</div>

<input
type="range"
id="length"
min="8"
max="64"
value="16"
>

</div>


<!-- CHARACTERS -->

<div class="option">

<div class="option-header">

<label>
Characters
</label>

</div>


<div class="checks">

<label class="check">

<input
type="checkbox"
id="uppercase"
checked
>

Uppercase (A-Z)

</label>


<label class="check">

<input
type="checkbox"
id="lowercase"
checked
>

Lowercase (a-z)

</label>


<label class="check">

<input
type="checkbox"
id="numbers"
checked
>

Numbers (0-9)

</label>


<label class="check">

<input
type="checkbox"
id="symbols"
checked
>

Symbols (!@#$)

</label>

</div>

</div>


<button
class="generate-btn"

onclick="generatePassword(true)"
>
Generate New Password
</button>

<div id="usageCounter" style="text-align:center;margin-top:12px;font-size:13px;color:#64748b;font-weight:600;">
    Free Plan · 5/5 generations remaining today
</div>

<!-- STRENGTH -->

<div class="strength">

<div class="strength-label">

<span>Password Strength</span>

<span
class="strength-text"
id="strengthText"
>
Strong
</span>

</div>

<div class="strength-bar">

<div
class="strength-fill"
id="strengthFill"
></div>

</div>

</div>


<div class="tip">

💡 <strong>Tip:</strong>
Use a long password with a combination of uppercase,
lowercase, numbers, and symbols for better security.

</div>


</div>

</main>


<script>

const result =
document.getElementById("passwordResult");

const length =
document.getElementById("length");

const lengthValue =
document.getElementById("lengthValue");

const uppercase =
document.getElementById("uppercase");

const lowercase =
document.getElementById("lowercase");

const numbers =
document.getElementById("numbers");

const symbols =
document.getElementById("symbols");

const strengthText =
document.getElementById("strengthText");

const strengthFill =
document.getElementById("strengthFill");


/* LENGTH */

length.addEventListener("input",function(){

    lengthValue.textContent = length.value;

    generatePassword();

});
/* SYNC PLAN FROM SERVER */

async function syncUserPlan(){

    try{

        const userData =
            JSON.parse(
                localStorage.getItem("hafa_user") || "{}"
            );

        if(!userData.email) return;

        const response =
            await fetch(
                "https://hafa-tools-backend.vercel.app/api/auth/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: userData.email,
                        password: userData.password || ""
                    })
                }
            );

        const data = await response.json();

        if(data.success && data.user){

            localStorage.setItem(
                "hafa_user",
                JSON.stringify(data.user)
            );

            updateUsageCounter();
        }

    }catch(error){

        console.error(
            "Plan sync error:",
            error
        );

    }
}

/* SYNC USER PLAN */

async function syncUserPlan(){

    try{

        const userData =
            JSON.parse(
                localStorage.getItem("hafa_user") || "{}"
            );

        if(!userData.email) return;

        const response =
            await fetch(
                "https://hafa-tools-backend.vercel.app/api/auth/user?email=" +
                encodeURIComponent(userData.email)
            );

        const data = await response.json();

        if(data.success && data.user){

            localStorage.setItem(
                "hafa_user",
                JSON.stringify(data.user)
            );

            updateUsageCounter();

        }

    }catch(error){

        console.error(
            "User plan sync error:",
            error
        );

    }
}

/* USAGE COUNTER */

function updateUsageCounter(){

    const counter =
        document.getElementById("usageCounter");

    if(!counter) return;

    try{

        const userData =
            JSON.parse(
                localStorage.getItem("hafa_user") || "{}"
            );

        const plan =
            String(
                userData.plan || "Free"
            ).trim().toLowerCase();

        if(plan === "pro"){

            counter.textContent =
                "HAFA PRO · Unlimited generations";

            counter.style.color =
                "#16a34a";

            return;
        }

        const today =
            new Date().toISOString().slice(0,10);

        const usage =
            JSON.parse(
                localStorage.getItem(
                    "hafa_password_usage"
                ) || "{}"
            );

        const count =
            usage.date === today
                ? (usage.count || 0)
                : 0;

        const remaining =
            Math.max(0, 5 - count);

        counter.textContent =
            "Free Plan · " +
            remaining +
            "/5 generations remaining today";

        counter.style.color =
            remaining === 0
                ? "#dc2626"
                : "#64748b";

    }catch(error){

        console.error(
            "Password counter error:",
            error
        );

    }
}
/* GENERATE */

function generatePassword(countUsage = false){

    /* FREE / PRO LIMIT */

    try {

        const userData =
            JSON.parse(
                localStorage.getItem("hafa_user") || "{}"
            );

        const plan =
            String(userData.plan || "Free")
                .trim()
                .toLowerCase();

if(plan !== "pro" && countUsage){
            const today =
                new Date().toISOString().slice(0,10);

            let usage =
                JSON.parse(
                    localStorage.getItem(
                        "hafa_password_usage"
                    ) || "{}"
                );

            let count =
                usage.date === today
                    ? (usage.count || 0)
                    : 0;

            if(count >= 5){

                alert(
                    "Free Plan sudah mencapai batas 5 generasi hari ini. Upgrade ke HAFA PRO untuk unlimited generations."
                );

                updateUsageCounter();

                return;
            }

            usage = {
                date: today,
                count: count + 1
            };

            localStorage.setItem(
                "hafa_password_usage",
                JSON.stringify(usage)
            );
        }

    } catch(error) {

        console.error(
            "Password usage error:",
            error
        );

    }
    let characters = "";

    if(uppercase.checked){
        characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    }

    if(lowercase.checked){
        characters += "abcdefghijklmnopqrstuvwxyz";
    }

    if(numbers.checked){
        characters += "0123456789";
    }

    if(symbols.checked){
        characters += "!@#$%^&*()_+-=[]{}|;:,.<>?";
    }


    if(!characters){

        result.textContent =
            "Select at least one option";

        strengthText.textContent =
            "None";

        strengthFill.style.width =
            "0%";

        return;

    }


    let password = "";

    const array =
        new Uint32Array(Number(length.value));

    crypto.getRandomValues(array);


    for(let i = 0; i < array.length; i++){

        password +=
            characters[
                array[i] % characters.length
            ];

    }


    result.textContent = password;

/* TOOLS USED */

if(countUsage){

    const currentUsed = parseInt(
        localStorage.getItem("hafa_tools_used") || "0",
        10
    );

    localStorage.setItem(
        "hafa_tools_used",
        String(currentUsed + 1)
    );

}

    // Save generated password to My History
    try {
        let history = JSON.parse(localStorage.getItem("hafa_history") || "[]");

        history.unshift({
            id: Date.now(),
            type: "Password",
            icon: "🔐",
            title: "Password",
            content: password,
            date: new Date().toISOString()
        });

        history = history.slice(0, 100);
        localStorage.setItem("hafa_history", JSON.stringify(history));
    } catch(error) {
        console.error("Failed to save password history:", error);
    }

    calculateStrength(password);

}


/* STRENGTH */

function calculateStrength(password){

    let score = 0;

    if(password.length >= 12){
        score++;
    }

    if(password.length >= 20){
        score++;
    }

    if(/[A-Z]/.test(password)){
        score++;
    }

    if(/[a-z]/.test(password)){
        score++;
    }

    if(/[0-9]/.test(password)){
        score++;
    }

    if(/[^A-Za-z0-9]/.test(password)){
        score++;
    }


    if(score <= 2){

        strengthText.textContent =
            "Weak";

        strengthFill.style.width =
            "30%";

    }

    else if(score <= 4){

        strengthText.textContent =
            "Medium";

        strengthFill.style.width =
            "60%";

    }

    else{

        strengthText.textContent =
            "Strong";

        strengthFill.style.width =
            "100%";

    }

}


/* COPY */

async function copyPassword(){

    const password =
        result.textContent;

    if(
        !password ||
        password === "Generating..." ||
        password === "Select at least one option"
    ){

        return;

    }


    try{

        await navigator.clipboard.writeText(password);

        const button =
            document.querySelector(".copy-btn");

        button.textContent =
            "Copied!";

        setTimeout(function(){

            button.textContent =
                "Copy";

        },1500);

    }catch(error){

        alert(
            "Unable to copy password."
        );

    }

}


/* INITIAL */

generatePassword();
syncUserPlan();

</script>

</body>
</html>
