<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My History - HAFA TOOLS</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#f8fafc;
    color:#0f172a;
}

.layout{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:250px;
    background:#ffffff;
    border-right:1px solid #e2e8f0;
    padding:25px 18px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
}

.logo{
    display:flex;
    align-items:baseline;
    gap:5px;
    text-decoration:none;
    margin-bottom:35px;
    padding-left:10px;
}

.logo-main{
    font-size:23px;
    font-weight:800;
    color:#0f172a;
    letter-spacing:-1.5px;
}

.logo-sub{
    font-size:14px;
    font-weight:600;
    color:#2563eb;
    letter-spacing:1px;
}

.menu-title{
    font-size:11px;
    color:#94a3b8;
    font-weight:700;
    margin:20px 10px 10px;
    text-transform:uppercase;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 13px;
    margin:4px 0;
    border-radius:10px;
    text-decoration:none;
    color:#64748b;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

.menu a:hover{
    background:#eff6ff;
    color:#2563eb;
}

.menu a.active{
    background:#eff6ff;
    color:#2563eb;
}

.logout{
    position:absolute;
    bottom:25px;
    left:18px;
    right:18px;
}

/* MAIN */

.main{
    margin-left:250px;
    width:calc(100% - 250px);
}

/* TOPBAR */

.topbar{
    height:75px;
    background:#ffffff;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 35px;
}

.page-title{
    font-size:18px;
    font-weight:700;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.user-name{
    font-size:14px;
    font-weight:600;
}

/* CONTENT */

.content{
    padding:35px;
    max-width:1200px;
}

.header{
    margin-bottom:25px;
}

.header h1{
    font-size:28px;
    margin-bottom:8px;
}

.header p{
    color:#64748b;
    font-size:14px;
}

/* FILTER */

.filter{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:18px;
    margin-bottom:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.filter button{
    border:1px solid #e2e8f0;
    background:white;
    padding:9px 15px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    color:#64748b;
}

.filter button:hover,
.filter button.active{
    background:#2563eb;
    border-color:#2563eb;
    color:white;
}

/* HISTORY */

.history-container{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.history-item{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    transition:.2s;
}

.history-item:hover{
    border-color:#bfdbfe;
    box-shadow:0 5px 20px rgba(15,23,42,.05);
}

.history-left{
    display:flex;
    align-items:center;
    gap:15px;
    min-width:0;
}

.history-icon{
    width:45px;
    height:45px;
    border-radius:12px;
    background:#eff6ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    flex-shrink:0;
}

.history-info{
    min-width:0;
}

.history-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:5px;
}

.history-preview{
    color:#64748b;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:650px;
}

.history-date{
    font-size:12px;
    color:#94a3b8;
    margin-top:5px;
}

.history-actions{
    display:flex;
    gap:8px;
}

.btn{
    border:none;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.copy-btn{
    background:#eff6ff;
    color:#2563eb;
}

.delete-btn{
    background:#fef2f2;
    color:#dc2626;
}

.copy-btn:hover{
    background:#dbeafe;
}

.delete-btn:hover{
    background:#fee2e2;
}

/* EMPTY */

.empty{
    background:white;
    border:1px dashed #cbd5e1;
    border-radius:15px;
    padding:60px 20px;
    text-align:center;
}

.empty-icon{
    font-size:45px;
    margin-bottom:15px;
}

.empty h3{
    font-size:17px;
    margin-bottom:7px;
}

.empty p{
    color:#64748b;
    font-size:13px;
}

/* MOBILE */

@media(max-width:800px){

    .sidebar{
        width:70px;
        padding:20px 10px;
    }

    .logo{
        justify-content:center;
        padding:0;
    }

    .logo-main{
        font-size:18px;
    }

    .logo-sub{
        display:none;
    }

    .menu-title{
        display:none;
    }

    .menu a{
        justify-content:center;
        padding:12px 5px;
        font-size:0;
    }

    .menu a span{
        font-size:20px;
    }

    .logout{
        left:10px;
        right:10px;
    }

    .main{
        margin-left:70px;
        width:calc(100% - 70px);
    }

    .topbar{
        padding:0 18px;
    }

    .content{
        padding:22px 15px;
    }

    .header h1{
        font-size:23px;
    }

    .history-item{
        align-items:flex-start;
        flex-direction:column;
    }

    .history-preview{
        max-width:100%;
    }

    .history-actions{
        width:100%;
    }

    .history-actions button{
        flex:1;
    }

}

</style>
</head>

<body>

<div class="layout">

<!-- SIDEBAR -->

<aside class="sidebar">

<a href="dashboard.html" class="logo">
<span class="logo-main">HAFA</span>
<span class="logo-sub">tools</span>
</a>

<div class="menu-title">MAIN</div>

<nav class="menu">

<a href="dashboard.html">
<span>⌂</span>
Dashboard
</a>

<a href="dashboard.html">
<span>⚡</span>
Tools
</a>

<a href="history.html" class="active">
<span>🕘</span>
History
</a>

<a href="#">
<span>💳</span>
Pricing
</a>

<a href="#">
<span>👤</span>
Profile
</a>

</nav>

<div class="logout">

<a href="#" onclick="logout()" class="menu">
<span>↪</span>
Logout
</a>

</div>

</aside>


<!-- MAIN -->

<main class="main">

<header class="topbar">

<div class="page-title">
My History
</div>

<div class="user">

<div class="avatar" id="avatar">U</div>

<div class="user-name" id="userName">
User
</div>

</div>

</header>


<section class="content">

<div class="header">

<h1>My History 📜</h1>

<p>
View and manage the content you've generated with HAFA TOOLS.
</p>

</div>


<!-- FILTER -->

<div class="filter">

<button class="active" onclick="filterHistory('all',this)">
All
</button>

<button onclick="filterHistory('AI Prompt',this)">
🤖 AI Prompt
</button>

<button onclick="filterHistory('Thumbnail',this)">
🖼️ Thumbnail
</button>

<button onclick="filterHistory('Caption',this)">
📝 Caption
</button>

<button onclick="filterHistory('Username',this)">
👤 Username
</button>

<button onclick="filterHistory('Password',this)">
🔐 Password
</button>

</div>


<!-- HISTORY LIST -->

<div id="historyContainer" class="history-container"></div>

</section>

</main>

</div>


<script>

/* AUTH */

const userData = localStorage.getItem("hafa_user");

if(!userData){

    window.location.href = "login.html";

}

let user;

try{

    user = JSON.parse(userData);

}catch(error){

    localStorage.removeItem("hafa_user");

    window.location.href = "login.html";

}


if(user){

    const name = user.name || "User";

    document.getElementById("userName").textContent = name;

    document.getElementById("avatar").textContent =
        name.charAt(0).toUpperCase();

}


/* HISTORY STORAGE */

const STORAGE_KEY = "hafa_history";


function getHistory(){

    try{

        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || [];

    }catch(error){

        return [];

    }

}


function saveHistory(data){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* RENDER */

let currentFilter = "all";


function renderHistory(){

    const container =
        document.getElementById("historyContainer");

    let history = getHistory();

    if(currentFilter !== "all"){

        history = history.filter(
            item => item.type === currentFilter
        );

    }


    if(history.length === 0){

        container.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                📭
            </div>

            <h3>
                No history yet
            </h3>

            <p>
                Your generated content will appear here.
            </p>

        </div>

        `;

        return;

    }


    container.innerHTML = history.map(
        (item,index) => `

        <div class="history-item">

            <div class="history-left">

                <div class="history-icon">
                    ${item.icon || "📄"}
                </div>

                <div class="history-info">

                    <div class="history-title">
                        ${escapeHtml(item.title || item.type)}
                    </div>

                    <div class="history-preview">
                        ${escapeHtml(item.content || "")}
                    </div>

                    <div class="history-date">
                        ${formatDate(item.date)}
                    </div>

                </div>

            </div>


            <div class="history-actions">

                <button
                    class="btn copy-btn"
                    onclick="copyHistory(${item.id})">

                    Copy

                </button>

                <button
                    class="btn delete-btn"
                    onclick="deleteHistory(${item.id})">

                    Delete

                </button>

            </div>

        </div>

        `
    ).join("");

}


/* FILTER */

function filterHistory(type,button){

    currentFilter = type;

    document
        .querySelectorAll(".filter button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderHistory();

}


/* COPY */

function copyHistory(id){

    const history = getHistory();

    const item = history.find(
        item => item.id === id
    );

    if(!item) return;

    navigator.clipboard.writeText(
        item.content || ""
    ).then(() => {

        alert("Copied to clipboard!");

    });

}


/* DELETE */

function deleteHistory(id){

    const history = getHistory();

    const updated = history.filter(
        item => item.id !== id
    );

    saveHistory(updated);

    renderHistory();

}


/* DATE */

function formatDate(date){

    if(!date) return "";

    const d = new Date(date);

    return d.toLocaleString(
        "en-US",
        {
            day:"numeric",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* SECURITY */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* LOGOUT */

function logout(){

    localStorage.removeItem("hafa_user");

    window.location.href = "login.html";

}


/* INITIAL */

renderHistory();

</script>

</body>
</html>
