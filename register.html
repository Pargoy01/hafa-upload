<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account — HAFA TOOLS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f9fc;
    color:#0f172a;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* NAVBAR */

.navbar{
    height:72px;
    background:rgba(255,255,255,.94);
    border-bottom:1px solid #e8edf5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
}

.logo{
    text-decoration:none;
    font-size:22px;
    font-weight:800;
    color:#111827;
}

.logo span{
    color:#2563eb;
}

.back{
    text-decoration:none;
    color:#64748b;
    font-size:14px;
    font-weight:600;
}

.back:hover{
    color:#2563eb;
}

/* REGISTER */

.register-wrapper{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px 20px;
    position:relative;
    overflow:hidden;
}

.register-wrapper::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(37,99,235,.08);
    border-radius:50%;
    filter:blur(90px);
    top:-220px;
    left:50%;
    transform:translateX(-50%);
}

.register-card{
    width:100%;
    max-width:440px;
    background:white;
    border:1px solid #e5eaf2;
    border-radius:20px;
    padding:40px;
    box-shadow:0 25px 60px rgba(15,23,42,.08);
    position:relative;
    z-index:2;
}

.register-header{
    text-align:center;
    margin-bottom:30px;
}

.register-header .icon{
    width:58px;
    height:58px;
    margin:0 auto 18px;
    border-radius:16px;
    background:#eff6ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
}

.register-header h1{
    font-size:30px;
    margin-bottom:10px;
    letter-spacing:-1px;
}

.register-header p{
    color:#64748b;
    font-size:14px;
    line-height:1.6;
}

/* FORM */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:13px;
    font-weight:700;
    color:#334155;
}

.form-group input{
    width:100%;
    padding:14px 15px;
    border:1px solid #dbe3ef;
    border-radius:10px;
    outline:none;
    font-size:15px;
    background:#fff;
    transition:.2s;
}

.form-group input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.password-info{
    margin-top:6px;
    font-size:12px;
    color:#94a3b8;
}

.register-btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
    transition:.2s;
    box-shadow:0 10px 25px rgba(37,99,235,.2);
}

.register-btn:hover{
    background:#1d4ed8;
}

.register-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* MESSAGE */

.message{
    display:none;
    padding:12px 14px;
    border-radius:9px;
    font-size:13px;
    margin-bottom:18px;
    line-height:1.5;
}

.message.error{
    display:block;
    background:#fef2f2;
    color:#b91c1c;
    border:1px solid #fecaca;
}

.message.success{
    display:block;
    background:#f0fdf4;
    color:#15803d;
    border:1px solid #bbf7d0;
}

/* LOGIN LINK */

.login-link{
    text-align:center;
    margin-top:25px;
    font-size:14px;
    color:#64748b;
}

.login-link a{
    color:#2563eb;
    text-decoration:none;
    font-weight:700;
}

.login-link a:hover{
    text-decoration:underline;
}

/* FOOTER */

footer{
    padding:25px 7%;
    text-align:center;
    background:white;
    border-top:1px solid #e8edf5;
}

footer p{
    color:#94a3b8;
    font-size:12px;
}

/* MOBILE */

@media(max-width:500px){

    .navbar{
        padding:0 20px;
    }

    .register-card{
        padding:30px 22px;
        border-radius:16px;
    }

    .register-header h1{
        font-size:27px;
    }

}

</style>
</head>

<body>

<nav class="navbar">

<a href="index.html" class="logo">
HAFA<span>TOOLS</span>
</a>

<a href="index.html" class="back">
← Back Home
</a>

</nav>


<main class="register-wrapper">

<div class="register-card">

<div class="register-header">

<div class="icon">
✨
</div>

<h1>Create your account</h1>

<p>
Join HAFA TOOLS and access your digital toolbox.
</p>

</div>


<div id="message" class="message"></div>


<form id="registerForm">

<div class="form-group">

<label for="name">
Full Name
</label>

<input
type="text"
id="name"
placeholder="Enter your name"
required
autocomplete="name"
>

</div>


<div class="form-group">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
placeholder="you@example.com"
required
autocomplete="email"
>

</div>


<div class="form-group">

<label for="password">
Password
</label>

<input
type="password"
id="password"
placeholder="Create a password"
required
autocomplete="new-password"
>

<div class="password-info">
Minimum 6 characters
</div>

</div>


<div class="form-group">

<label for="confirmPassword">
Confirm Password
</label>

<input
type="password"
id="confirmPassword"
placeholder="Repeat your password"
required
autocomplete="new-password"
>

</div>


<button
type="submit"
class="register-btn"
id="registerBtn"
>
Create Account →
</button>

</form>


<div class="login-link">

Already have an account?
<a href="login.html">
Login
</a>

</div>

</div>

</main>


<footer>

<p>
© 2026 HAFA TOOLS. All rights reserved.
</p>

</footer>


<script>

const API_URL = "https://hafa-tools-backend.vercel.app";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerBtn");

function showMessage(text, type){

    message.textContent = text;

    message.className = "message " + type;

}

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if(password.length < 6){

        showMessage(
            "Password minimal 6 karakter.",
            "error"
        );

        return;
    }


    if(password !== confirmPassword){

        showMessage(
            "Password dan konfirmasi password tidak sama.",
            "error"
        );

        return;
    }


    button.disabled = true;
    button.textContent = "Creating account...";

    message.className = "message";


    try{

        const response = await fetch(
            API_URL + "/api/auth/register",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    name,
                    email,
                    password
                })
            }
        );


        const data = await response.json();


        if(!response.ok){

            showMessage(
                data.message || "Registrasi gagal.",
                "error"
            );

            return;
        }


        showMessage(
            "Account created successfully! Redirecting to login...",
            "success"
        );


        form.reset();


        setTimeout(function(){

            window.location.href = "login.html";

        },1500);


    }catch(error){

        console.error(error);

        showMessage(
            "Tidak dapat terhubung ke server HAFA TOOLS.",
            "error"
        );

    }finally{

        button.disabled = false;
        button.textContent = "Create Account →";

    }

});

</script>

</body>
</html>
